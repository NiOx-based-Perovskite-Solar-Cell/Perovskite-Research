<rect x="312" y="568" width="28" height="14" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.08"/>
<text x="348" y="579" font-family="Geist Mono, monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75">MODEL ENGINE</text>
