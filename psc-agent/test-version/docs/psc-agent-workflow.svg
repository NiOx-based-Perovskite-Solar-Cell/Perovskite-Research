<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="psc-agent-workflow-title psc-agent-workflow-desc" id="psc-agent-workflow-root">
        <title id="psc-agent-workflow-title">How psc-agent turns papers into checked data</title>
        <desc id="psc-agent-workflow-desc">Papers pass an SI step, then extract, a second reader and a precision gate that stages only what both readers agree on; recheck, evaluate and analyze run beside that loop, and one runtime of skills, hooks and model providers serves them all.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #psc-agent-workflow-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #psc-agent-workflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #psc-agent-workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#psc-agent-workflow-root .diagram-container { overflow-x: visible; }
}</style>
