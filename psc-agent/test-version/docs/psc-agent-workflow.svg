<text x="76" y="579" font-family="Geist Mono, monospace" font-size="8" letter-spacing="0.06em" fill="#4f5d75">DATA / FILES</text>
<rect x="196" y="568" width="28" height="14" rx="3" fill="#f5f5f5" stroke="#2d3142"/>
