<rect x="248" y="96" width="168" height="100" rx="6" fill="#f5f5f5"/><rect x="248" y="96" width="168" height="100" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="264" y="124" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">SI step</text><text x="264" y="142" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">reader (model): SI?</text><text x="264" y="156" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">prints its address?</text><text x="264" y="170" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">ACS · Wiley link pattern</text><text x="264" y="184" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">web agent: links only</text>
<rect x="248" y="252" width="168" height="92" rx="6" fill="#f5f5f5"/><rect x="248" y="252" width="168" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3"/><text x="264" y="280" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Agent server</text><text x="264" y="298" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">outside Docker, host</text><text x="264" y="312" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">your signed-in Chrome</text><text x="264" y="326" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">token · saves to SI/</text>
<rect x="456" y="96" width="168" height="100" rx="6" fill="#f5f5f5"/><rect x="456" y="96" width="168" height="100" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="472" y="124" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Extract</text><text x="472" y="142" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">paper map, then rows</text><text x="472" y="156" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">decision per row</text><text x="472" y="170" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">asks failed sheets again</text><text x="472" y="184" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">→ drafts + review.csv</text>
<rect x="664" y="96" width="168" height="100" rx="6" fill="#f5f5f5"/><rect x="664" y="96" width="168" height="100" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="680" y="124" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Second reader</text><text x="680" y="142" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">Recheck, another model</text><text x="680" y="156" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">each cell vs the paper</text><text x="680" y="170" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">confirmed · disputed</text>
<rect x="872" y="96" width="168" height="100" rx="6" fill="#f5f5f5"/><rect x="872" y="96" width="168" height="100" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="888" y="124" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Gate · staged/</text><text x="888" y="142" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">both readers agree</text><text x="888" y="156" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">calibrated: ≥ 90% right</text><text x="888" y="170" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">→ staged/ · held.csv</text>
