<rect x="1080" y="96" width="160" height="500" rx="6" fill="#f5f5f5"/><rect x="1080" y="96" width="160" height="500" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.08"/><text x="1096" y="118" font-family="Geist Mono, monospace" font-size="8" letter-spacing="0.18em" fill="#bf4520">SKILLS + HOOKS</text><text x="1096" y="138" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Runtime</text><text x="1096" y="156" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">every model call goes</text><text x="1096" y="170" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">through this one client</text><text x="1096" y="184" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580"></text><text x="1096" y="198" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">skills = system prompts</text><text x="1096" y="212" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">hooks = checkpoints:</text><text x="1096" y="226" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">  trace · budget</text><text x="1096" y="240" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">  quote check · cancel</text><text x="1096" y="254" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580"></text><text x="1096" y="268" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">provider (--provider):</text><text x="1096" y="282" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">  gemini 3.5 flash</text><text x="1096" y="296" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">  openrouter (Claude)</text><text x="1096" y="310" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">  claude-code (plan)</text><text x="1096" y="324" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">  ollama cloud</text><text x="1096" y="338" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580"></text><text x="1096" y="352" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">disk cache, retries</text><text x="1096" y="366" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">gemini: no tool use</text><text x="1096" y="380" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">  (no Analyze)</text><text x="1096" y="394" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580"></text><text x="1096" y="408" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">set with</text><text x="1096" y="422" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">  --provider (CLI)</text><text x="1096" y="436" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">  PSC_PROVIDER (web)</text>
