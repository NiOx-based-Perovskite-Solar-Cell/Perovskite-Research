<rect x="40" y="100" width="200" height="72" rx="6" fill="#f5f5f5"/>
<rect x="40" y="100" width="200" height="72" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
<text x="56" y="128" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Papers</text>
<text x="56" y="146" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">PDF + SI/ folder</text>
<text x="56" y="160" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">original paper/</text>
<rect x="40" y="300" width="200" height="72" rx="6" fill="#f5f5f5"/>
<rect x="40" y="300" width="200" height="72" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
<text x="56" y="328" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Hand-entered workbooks</text>
<text x="56" y="346" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">Raw Data/*.xlsx</text>
<text x="56" y="360" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">6 sheets per device</text>
<rect x="300" y="156" width="200" height="160" rx="6" fill="#f5f5f5"/>
<rect x="300" y="156" width="200" height="160" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="316" y="184" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Pairing &amp; SI finder</text>
<text x="316" y="202" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">pairs: PDF ↔ workbooks (DOI)</text>
<text x="316" y="216" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">si: web search → SI/ PDFs</text>
<text x="316" y="230" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">blocked? gives links to open</text>
<text x="316" y="244" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">--no-si ignores the SI</text>
<rect x="300" y="420" width="200" height="72" rx="6" fill="#f5f5f5"/>
<rect x="300" y="420" width="200" height="72" rx="6" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
<text x="316" y="448" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Processed tables</text>
<text x="316" y="466" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">processed/prepared_v2 CSV</text>
<text x="316" y="480" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">column catalog</text>
<rect x="600" y="60" width="220" height="72" rx="6" fill="#f5f5f5"/>
<rect x="600" y="60" width="220" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="616" y="88" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Extract</text>
<text x="616" y="106" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">PDF (+SI) → draft .xlsx</text>
<text x="616" y="120" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">review.csv (verify_more)</text>
<rect x="600" y="180" width="220" height="72" rx="6" fill="#f5f5f5"/>
<rect x="600" y="180" width="220" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="616" y="208" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Recheck</text>
<text x="616" y="226" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">blind re-read of each row</text>
<text x="616" y="240" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">→ findings.csv</text>
<rect x="600" y="300" width="220" height="72" rx="6" fill="#f5f5f5"/>
<rect x="600" y="300" width="220" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="616" y="328" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Evaluate</text>
<text x="616" y="346" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">extract, then score vs record</text>
<text x="616" y="360" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">→ report.md, cells_all.csv</text>
<rect x="600" y="420" width="220" height="72" rx="6" fill="#f5f5f5"/>
<rect x="600" y="420" width="220" height="72" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="616" y="448" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Analyze</text>
<text x="616" y="466" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">tools + claims, sign tests</text>
<text x="616" y="480" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">→ PLAN.md, INSIGHTS.md</text>
<rect x="880" y="60" width="200" height="432" rx="6" fill="#f5f5f5"/>
<rect x="880" y="60" width="200" height="432" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.08"/>
<text x="896" y="82" font-family="Geist Mono, monospace" font-size="8" letter-spacing="0.18em" fill="#bf4520">SKILLS + HOOKS</text>
<text x="896" y="102" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Runtime</text>
<text x="896" y="120" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">skills = system prompts</text>
<text x="896" y="134" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">hooks = checkpoints:</text>
<text x="896" y="148" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">  trace · budget · quotes</text>
<text x="896" y="162" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580"></text>
<text x="896" y="176" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">provider (--provider):</text>
<text x="896" y="190" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">  claude-code (subscription)</text>
<text x="896" y="204" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">  openrouter (API key)</text>
<text x="896" y="218" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580"></text>
<text x="896" y="232" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">one client interface,</text>
<text x="896" y="246" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">cache on disk, retries</text>
