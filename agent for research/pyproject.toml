[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psc-agent"
version = "0.2.0"
description = "Research agent for perovskite solar cell papers: extract and recheck data from PDFs and find insights in the dataset, steered by skills and hooks, with models on OpenRouter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pydantic>=2.5",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
analysis = ["pandas>=2.0"]
web = ["flask>=3.0", "waitress>=3.0", "pandas>=2.0"]

[project.scripts]
psc-agent = "psc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
psc_agent = ["skills/*/SKILL.md", "web/templates/*.html", "web/static/*.css", "web/static/*.js"]
